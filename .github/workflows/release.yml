name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  packages: write

env:
  IMAGE_NAME: ghcr.io/fthomys/emojistealer-bot
  BIN_NAME: stealemoji-bot

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  binaries:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: win64
            os: windows-latest
            target: x86_64-pc-windows-msvc
          - name: winarm64
            os: windows-latest
            target: aarch64-pc-windows-msvc
          - name: linux64
            os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            cross: true
          - name: linuxarm64
            os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            cross: true
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install cross
        if: matrix.cross
        run: cargo install cross --locked

      - name: Build with cross
        if: matrix.cross
        run: cross build --release --target ${{ matrix.target }}

      - name: Build natively
        if: ${{ !matrix.cross }}
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path target/${{ matrix.target }}/release/${{ env.BIN_NAME }}.exe -DestinationPath ${{ env.BIN_NAME }}-${{ github.ref_name }}-${{ matrix.name }}.zip

      - name: Package archive (Linux)
        if: runner.os == 'Linux'
        run: tar -czf ${{ env.BIN_NAME }}-${{ github.ref_name }}-${{ matrix.name }}.tar.gz -C target/${{ matrix.target }}/release ${{ env.BIN_NAME }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            ${{ env.BIN_NAME }}-${{ github.ref_name }}-${{ matrix.name }}.zip
            ${{ env.BIN_NAME }}-${{ github.ref_name }}-${{ matrix.name }}.tar.gz
          if-no-files-found: ignore

  release:
    needs: binaries
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
